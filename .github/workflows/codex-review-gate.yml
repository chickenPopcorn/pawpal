name: Codex review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to refresh
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  publish-gate:
    # Codex task completion comes from its summary, independently of GitHub's
    # review decision. These trusted events also retain write access for forks.
    if: >-
      (github.event_name != 'issue_comment' &&
       (github.event_name != 'pull_request_target' ||
        github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event.issue.pull_request &&
       (github.event.comment.user.id == 199175422 ||
        ((contains(github.event.comment.body, '@codex') ||
          contains(github.event.changes.body.from, '@codex')) &&
         contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association))))
    # One run per PR at a time, so the newest run always publishes last.
    # Only pull_request_target runs show as a check on the PR head, and a
    # cancelled one stays there as a failure. So only those runs cancel an
    # in-progress run; comment and manual runs wait their turn instead.
    concurrency:
      group: codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      # Never check out a PR head: this workflow has permission to publish statuses.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { runCodexReviewGate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/codex-review-gate.mjs`);
            await runCodexReviewGate({ github, context, core });
